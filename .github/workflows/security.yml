name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly: new advisories land even when the code does not change
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by version tag; Dependabot (see dependabot.yml) proposes updates. Pin by SHA once a registry-connected run resolves them.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python test_app.py
      - run: python test_edge.py
      - name: SAST (Bandit)
        run: bandit -r app.py -ll
      - name: SCA (pip-audit on the pinned runtime lock)
        run: pip-audit -r requirements.lock --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-fund
      - run: npx tsc --noEmit
      - name: SCA (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env: { BACKEND_URL: "http://backend:8000" }

  sast-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Semgrep
        run: |
          pip install semgrep
          semgrep --config p/python --config p/typescript --config p/react --config p/dockerfile --config p/owasp-top-ten --config p/secrets \
            --metrics=off --error --exclude node_modules --exclude .next --exclude .venv --exclude docs backend frontend scripts
      - name: Secrets in history (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --no-banner

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile lint
        run: |
          docker run --rm -i hadolint/hadolint < backend/Dockerfile
          docker run --rm -i hadolint/hadolint < frontend/Dockerfile
      - name: Build images
        run: docker compose build
      - name: Trivy, images and configuration (HIGH/CRITICAL fail the build)
        run: |
          for img in parsely-backend parsely-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$img"
          done
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest config --exit-code 1 --severity HIGH,CRITICAL /src
      - name: Compose smoke test (edge, API behind it, security headers)
        run: |
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:8080/api/overview -o /dev/null
          curl -fsSI http://127.0.0.1:8080/ | grep -i "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs)" != "200"
          docker compose down -v
